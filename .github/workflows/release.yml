name: Release Obsidian plugin

# Triggers when a version tag (e.g. 0.1.0) is pushed
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      # -- Install & verify ------------------------------------------------
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # -- Build ------------------------------------------------------------
      # Produces main.js at repo root (typecheck + esbuild production bundle)
      - name: Build plugin
        run: npm run build

      # -- Attest & release ---------------------------------------------------
      # Provenance attestations for release assets; required permissions above
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Publishes a DRAFT release — assets go live only after manual publish
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
